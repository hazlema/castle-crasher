<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Castle Crasher</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="hud">
    <div id="stats">
      <span id="level"></span>
      <span id="shots"></span>
      <span id="crates"></span>
      <span id="powerups"></span>
    </div>
    <div id="resolve-wrap"><div id="resolve-bar"></div></div>
    <div id="power-wrap"><div id="power-bar"></div></div>
    <div id="toasts"></div>
    <div id="banner">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>
    <div id="help">←/→ aim &nbsp;·&nbsp; hold SPACE to move the yellow landing marker &nbsp;·&nbsp; release to fire &nbsp;·&nbsp; hold H to check crates &nbsp;·&nbsp; ESC menu</div>
    <div id="menu">
      <div id="menu-panel">
        <div id="menu-title">Paused</div>
        <div id="menu-items"></div>
        <div id="menu-hint">↑↓ select &nbsp;·&nbsp; ←→ adjust &nbsp;·&nbsp; ENTER choose &nbsp;·&nbsp; ESC resume</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
